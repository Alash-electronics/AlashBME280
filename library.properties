sentence=Easy BME280 / BMP280 sensor library: temperature, humidity, pressure, altitude, dew point. Auto-detects address, clear error messages, no dependencies.
paragraph=Reads BME280 and BMP280 over I2C with a one-line begin(): finds the address (0x76/0x77) and the chip itself, explains wiring problems in Russian, Kazakh or English, and measures only when needed. Works on Arduino AVR, ESP32, ESP8266 and other boards. Needs only the built-in Wire library. Examples included, made for classes and kits by Alash Electronics.
